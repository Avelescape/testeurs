<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
  >

  <meta name="theme-color" content="#120b05">

  <title>Mise en marche du phare</title>

  <style>
    :root {
      /*
        Position calculée à partir des coordonnées GIMP :

        Centre du disque :
        X = 618 px
        Y = 709 px

        Dimensions de la photo :
        943 × 1668 px
      */

      --manivelle-x: 54.08%;
      --manivelle-y: 34.31%;
      --manivelle-largeur: 35%;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #080604;
      color: white;
      font-family: Georgia, serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
    }

    /*
      La scène conserve exactement les proportions
      de l’image originale : 943 × 1668 pixels.
    */
    .scene {
      position: relative;

      width: min(
        100vw,
        calc(100svh * 943 / 1668)
      );

      aspect-ratio: 943 / 1668;

      overflow: hidden;
      background: #130b04;
      isolation: isolate;
    }

    /*
      L’image remplit exactement la scène.
      Elle n’est jamais recadrée.
    */
    .fond {
      position: absolute;
      inset: 0;

      display: block;
      width: 100%;
      height: 100%;

      object-fit: fill;

      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .voile {
      position: absolute;
      z-index: 2;
      inset: 0;

      background:
        linear-gradient(
          #0003 0 10%,
          transparent 22% 73%,
          #0005
        );

      pointer-events: none;
    }

    .consigne {
      position: absolute;
      z-index: 6;

      top: max(
        14px,
        env(safe-area-inset-top)
      );

      left: 50%;
      transform: translateX(-50%);

      width: max-content;
      max-width: 88%;

      padding: 9px 15px;

      border: 1px solid #e8bd69aa;
      border-radius: 999px;

      background: #160d07d9;
      box-shadow: 0 4px 18px #0009;

      color: #ffe7ad;
      text-align: center;

      font-size: clamp(14px, 4vw, 19px);
      letter-spacing: 0.02em;

      transition: opacity 0.35s;
    }

    .compteur {
      position: absolute;
      z-index: 6;

      top: 18%;
      right: 4%;

      width: 72px;
      padding: 9px 5px;

      border: 1px solid #d7a84e;
      border-radius: 9px;

      background: #160d07dc;
      box-shadow: 0 5px 20px #000a;

      text-align: center;
      color: #ffe4a1;
    }

    .compteur strong {
      display: block;
      font: 700 25px/1 Arial, sans-serif;
    }

    .compteur small {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /*
      La manivelle est positionnée par rapport
      aux proportions de la photo du phare.
    */
    .manivelle-zone {
      position: absolute;
      z-index: 5;

      left: var(--manivelle-x);
      top: var(--manivelle-y);
      width: var(--manivelle-largeur);

      /*
        Dimensions de l’image de la manivelle :
        1774 × 887 pixels.
      */
      aspect-ratio: 1774 / 887;

      /*
        Le centre du disque se trouve à 19,75 %
        de la largeur de l’image de la manivelle.
      */
      transform-origin: 19.75% 50%;

      touch-action: none;
      cursor: grab;

      filter: drop-shadow(0 7px 5px #000b);

      will-change: transform;
    }

    .manivelle-zone:active {
      cursor: grabbing;
    }

    /*
      Quatre engrenages positionnés à partir des
      coordonnées relevées dans GIMP.
      Ils sont visibles dès le début, mais immobiles.
    */
    .engrenage {
      position: absolute;
      z-index: 4;

      left: var(--engrenage-x);
      top: var(--engrenage-y);
      width: var(--engrenage-largeur);
      height: auto;

      display: block;
      transform: translate(-50%, -50%) rotate(0deg);
      transform-origin: 50% 50%;

      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;

      filter: drop-shadow(0 5px 5px #000a);
      will-change: transform;
    }

    .engrenage-1 {
      --engrenage-x: 63.73%;
      --engrenage-y: 59.05%;
      --engrenage-largeur: 20%;
    }

    .engrenage-2 {
      --engrenage-x: 62.99%;
      --engrenage-y: 50.96%;
      --engrenage-largeur: 20%;
    }

    .engrenage-3 {
      --engrenage-x: 50.48%;
      --engrenage-y: 50.60%;
      --engrenage-largeur: 20%;
    }

    .engrenage-4 {
      --engrenage-x: 38.18%;
      --engrenage-y: 47.78%;
      --engrenage-largeur: 30%;
    }

    .engrenages-actifs .engrenage-1,
    .engrenages-actifs .engrenage-3 {
      animation: rotation-engrenage-horaire 2.4s linear infinite;
    }

    .engrenages-actifs .engrenage-2,
    .engrenages-actifs .engrenage-4 {
      animation: rotation-engrenage-antihoraire 3.15s linear infinite;
    }

    @keyframes rotation-engrenage-horaire {
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    @keyframes rotation-engrenage-antihoraire {
      to {
        transform: translate(-50%, -50%) rotate(-360deg);
      }
    }

    .manivelle {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: contain;

      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .aide {
      position: absolute;
      z-index: 6;

      left: 50%;

      bottom: max(
        18px,
        env(safe-area-inset-bottom)
      );

      transform: translateX(-50%);

      width: max-content;
      max-width: 90%;

      padding: 8px 13px;

      border-radius: 7px;

      background: #0d0805d9;
      color: #f2d69e;

      font-size: clamp(12px, 3.4vw, 16px);
      text-align: center;

      pointer-events: none;

      transition: opacity 0.4s;
    }

    /*
      Fenêtre de réussite.
    */
    .termine {
      position: absolute;
      z-index: 10;
      inset: 0;

      display: grid;
      place-items: center;

      padding: 24px;

      background: #080500a8;
      backdrop-filter: blur(3px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.55s,
        visibility 0.55s;
    }

    .termine.visible {
      opacity: 1;
      visibility: visible;
    }

    .carte {
      width: min(360px, 90%);
      padding: 25px 20px;

      border: 2px solid #d6a74e;
      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #3a210d,
          #130b05
        );

      box-shadow: 0 15px 50px #000;

      text-align: center;
      color: #ffe9b7;
    }

    .carte h1 {
      margin: 0 0 9px;
      font-size: 25px;
    }

    .carte p {
      margin: 0;
      line-height: 1.45;
    }

    .carte button {
      margin-top: 18px;
      padding: 11px 19px;

      border: 1px solid #ffe0a0;
      border-radius: 8px;

      background: #b77822;
      color: #fff8e8;

      font: bold 16px Georgia, serif;

      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="scene" id="scene">

    <!-- Image du phare -->
    <img
      class="fond"
      src="images/1-png3.png"
      alt="Salle du mécanisme du phare"
      draggable="false"
    >

    <div class="voile"></div>

    <!-- Deux exemplaires de chacun des deux engrenages -->
    <img
      class="engrenage engrenage-1"
      src="images/1-pngengrenage.png"
      alt=""
      draggable="false"
    >

    <img
      class="engrenage engrenage-2"
      src="images/1-pngengrenagegrand.png"
      alt=""
      draggable="false"
    >

    <img
      class="engrenage engrenage-3"
      src="images/1-pngengrenage.png"
      alt=""
      draggable="false"
    >

    <img
      class="engrenage engrenage-4"
      src="images/1-pngengrenagegrand.png"
      alt=""
      draggable="false"
    >

    <!-- Manivelle interactive -->
    <div
      class="manivelle-zone"
      id="manivelle"
      role="slider"
      tabindex="0"
      aria-label="Manivelle du phare"
      aria-valuemin="0"
      aria-valuemax="4"
      aria-valuenow="0"
    >

      <img
        class="manivelle"
        src="images/1-pngmanivelle.png"
        alt=""
        draggable="false"
      >

    </div>

    <div class="aide" id="aide">
      Posez le doigt sur la manivelle et faites-la tourner
    </div>

    <!-- Fenêtre affichée après quatre tours -->
    <section
      class="termine"
      id="termine"
      aria-hidden="true"
    >

      <div class="carte">

        <button type="button" id="continuer">
          Continuer
        </button>

      </div>

    </section>

  </main>

  <script>
    (() => {
      /*
        Nombre de tours à réaliser.
      */
      const TOURS_REQUIS = 4;

      /*
        Vitesse maximale : 180 degrés par seconde,
        soit environ un tour toutes les deux secondes.
      */
      const VITESSE_MAX_DEGRES_SECONDE = 180;

      /*
        Page ouverte après avoir appuyé
        sur le bouton Continuer.

        Exemple :
        const LIEN_SUIVANT = "phare-allume.html";
      */
      const LIEN_SUIVANT = "";

      /*
        Dimensions exactes de la photo du phare.
      */
      const LARGEUR_PHOTO = 943;
      const HAUTEUR_PHOTO = 1668;

      /*
        Coordonnées relevées dans GIMP.
      */
      const AXE_GIMP_X = 618;
      const AXE_GIMP_Y = 709;

      const scene =
        document.querySelector("#scene");

      const manivelle =
        document.querySelector("#manivelle");

      const aide =
        document.querySelector("#aide");

      const termine =
        document.querySelector("#termine");

      const continuer =
        document.querySelector("#continuer");

      let actif = false;
      let dernierAngle = 0;
      let dernierInstant = 0;

      let rotation = 0;
      let progression = 0;
      let tours = 0;

      let fini = false;

      let pivotX = 0;
      let pivotY = 0;

      /*
        Variables utilisées pour créer les sons.
        Aucun fichier audio n’est nécessaire.
      */
      let audioCtx;
      let angleDernierClic = 0;

      /*
        Un clic est produit tous les 15 degrés de rotation.
        Diminuez cette valeur pour avoir davantage de clics.
      */
      const PAS_CLIC_METALLIQUE = 15;

      function preparerAudio() {
        if (!audioCtx) {
          audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
          )();
        }

        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      }

      /*
        Petit claquement métallique créé avec Web Audio.
        Aucun fichier sonore externe n'est nécessaire.
      */
      function jouerClicMetallique(intensite = 1) {
        preparerAudio();

        const maintenant = audioCtx.currentTime;
        const oscillateurA = audioCtx.createOscillator();
        const oscillateurB = audioCtx.createOscillator();
        const gainA = audioCtx.createGain();
        const gainB = audioCtx.createGain();
        const filtre = audioCtx.createBiquadFilter();

        /* Attaque sèche, semblable au choc de deux pièces d'acier. */
        oscillateurA.type = "square";
        oscillateurA.frequency.setValueAtTime(1250, maintenant);
        oscillateurA.frequency.exponentialRampToValueAtTime(
          430,
          maintenant + 0.025
        );

        /* Petite résonance aiguë qui donne le caractère métallique. */
        oscillateurB.type = "triangle";
        oscillateurB.frequency.setValueAtTime(2200, maintenant);
        oscillateurB.frequency.exponentialRampToValueAtTime(
          780,
          maintenant + 0.055
        );

        filtre.type = "bandpass";
        filtre.frequency.value = 1150;
        filtre.Q.value = 3.2;

        gainA.gain.setValueAtTime(
          Math.min(0.19, 0.12 + intensite * 0.025),
          maintenant
        );
        gainA.gain.exponentialRampToValueAtTime(
          0.001,
          maintenant + 0.06
        );

        gainB.gain.setValueAtTime(
          Math.min(0.11, 0.065 + intensite * 0.018),
          maintenant
        );
        gainB.gain.exponentialRampToValueAtTime(
          0.001,
          maintenant + 0.09
        );

        oscillateurA
          .connect(filtre)
          .connect(gainA)
          .connect(audioCtx.destination);

        oscillateurB
          .connect(gainB)
          .connect(audioCtx.destination);

        oscillateurA.start(maintenant);
        oscillateurB.start(maintenant);
        oscillateurA.stop(maintenant + 0.065);
        oscillateurB.stop(maintenant + 0.095);
      }

      /*
        Calcule l’emplacement du centre de rotation
        à partir des coordonnées relevées dans GIMP.
      */
      function calculerPositionAxe() {
        const sceneRect =
          scene.getBoundingClientRect();

        const echelleX =
          sceneRect.width / LARGEUR_PHOTO;

        const echelleY =
          sceneRect.height / HAUTEUR_PHOTO;

        pivotX =
          sceneRect.left +
          AXE_GIMP_X * echelleX;

        pivotY =
          sceneRect.top +
          AXE_GIMP_Y * echelleY;
      }

      /*
        Calcule l’angle du doigt autour
        du centre du disque.
      */
      function obtenirAngleDuDoigt(evenement) {
        return (
          Math.atan2(
            evenement.clientY - pivotY,
            evenement.clientX - pivotX
          ) *
          180 /
          Math.PI
        );
      }

      /*
        Le joueur pose son doigt
        sur la manivelle.
      */
      function commencerRotation(evenement) {
        if (fini) {
          return;
        }

        evenement.preventDefault();

        calculerPositionAxe();

        actif = true;

        dernierAngle =
          obtenirAngleDuDoigt(evenement);

        dernierInstant = evenement.timeStamp;

        manivelle.setPointerCapture(
          evenement.pointerId
        );

        preparerAudio();
        angleDernierClic = rotation;

        aide.style.opacity = "0.25";
      }

      /*
        Le joueur tourne la manivelle.
      */
      function faireTourner(evenement) {
        if (!actif || fini) {
          return;
        }

        evenement.preventDefault();

        const nouvelAngle =
          obtenirAngleDuDoigt(evenement);

        let difference =
          nouvelAngle - dernierAngle;

        const tempsEcoule = Math.max(
          1,
          evenement.timeStamp - dernierInstant
        );

        /*
          Empêche le saut de rotation lorsque
          l’angle passe de 180° à -180°.
        */
        if (difference > 180) {
          difference -= 360;
        }

        if (difference < -180) {
          difference += 360;
        }

        /*
          Empêche le joueur de faire tourner la manivelle
          plus vite que la vitesse maximale autorisée.
        */
        const deplacementMaximum =
          VITESSE_MAX_DEGRES_SECONDE *
          tempsEcoule /
          1000;

        difference = Math.max(
          -deplacementMaximum,
          Math.min(deplacementMaximum, difference)
        );

        dernierAngle = nouvelAngle;
        dernierInstant = evenement.timeStamp;

        rotation += difference;

        /* Clics métalliques calés sur la rotation réelle. */
        if (
          Math.abs(rotation - angleDernierClic) >=
          PAS_CLIC_METALLIQUE
        ) {
          jouerClicMetallique(
            Math.min(2, Math.abs(difference) / 8)
          );
          angleDernierClic = rotation;
        }

        /*
          Les tours doivent être réalisés
          dans le sens horaire.

          Si le joueur tourne en arrière,
          la progression diminue.
        */
        progression = Math.max(
          0,
          progression + difference
        );

        manivelle.style.transform =
          `rotate(${rotation}deg)`;

        const nouveauxTours = Math.min(
          TOURS_REQUIS,
          Math.floor(progression / 360)
        );

        if (nouveauxTours > tours) {
          tours = nouveauxTours;

          actualiserAffichage();
        }

        if (
          progression >=
          TOURS_REQUIS * 360
        ) {
          afficherReussite();
        }
      }

      /*
        Le joueur retire son doigt.
      */
      function terminerRotation(evenement) {
        if (!actif) {
          return;
        }

        actif = false;

        aide.style.opacity = "1";

        try {
          manivelle.releasePointerCapture(
            evenement.pointerId
          );
        } catch (erreur) {
          // Aucun traitement nécessaire.
        }
      }

      function actualiserAffichage() {
        manivelle.setAttribute(
          "aria-valuenow",
          tours
        );
      }

      function afficherReussite() {
        fini = true;
        actif = false;
        tours = TOURS_REQUIS;

        actualiserAffichage();

        /* Démarre les quatre engrenages après le quatrième tour. */
        scene.classList.add("engrenages-actifs");

        aide.style.opacity = "0";

        setTimeout(() => {
          termine.classList.add("visible");

          termine.setAttribute(
            "aria-hidden",
            "false"
          );

          continuer.focus();
        }, 350);

        if (navigator.vibrate) {
          navigator.vibrate([
            80,
            60,
            120
          ]);
        }
      }

      /*
        Événements tactiles et souris.
      */
      manivelle.addEventListener(
        "pointerdown",
        commencerRotation
      );

      manivelle.addEventListener(
        "pointermove",
        faireTourner
      );

      manivelle.addEventListener(
        "pointerup",
        terminerRotation
      );

      manivelle.addEventListener(
        "pointercancel",
        terminerRotation
      );

      /*
        Recalcule l’axe après un changement
        de taille ou d’orientation.
      */
      window.addEventListener(
        "resize",
        calculerPositionAxe
      );

      window.addEventListener(
        "orientationchange",
        calculerPositionAxe
      );

      /*
        Bouton Continuer.
      */
      continuer.addEventListener(
        "click",
        () => {
          if (LIEN_SUIVANT) {
            window.location.href =
              LIEN_SUIVANT;
          } else {
            termine.classList.remove(
              "visible"
            );

            termine.setAttribute(
              "aria-hidden",
              "true"
            );
          }
        }
      );

      /*
        Premier calcul au chargement.
      */
      calculerPositionAxe();
    })();
  </script>

</body>
</html>
